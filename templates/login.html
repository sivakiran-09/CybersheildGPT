<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberShield GPT — Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">

<div class="login-box">
    <div class="logo" style="justify-content:center; margin-bottom: 6px;">
        🛡️ CyberShield <span>GPT</span>
    </div>
    <p class="login-subtitle">Hospital Network Security Console</p>

    {% if signed_up %}
    <div class="login-success">Account created — please sign in.</div>
    {% endif %}

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}" class="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="admin" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>

        <button type="submit">Sign In</button>
    </form>

    <p class="login-hint">
        Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a>
    </p>
</div>

</body>
</html>
