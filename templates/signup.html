<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberShield GPT — Sign Up</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">

<div class="login-box">
    <div class="logo" style="justify-content:center; margin-bottom: 6px;">
        🛡️ CyberShield <span>GPT</span>
    </div>
    <p class="login-subtitle">Create a Security Console Account</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('signup') }}" class="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>

        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" placeholder="••••••••" required>

        <button type="submit">Create Account</button>
    </form>

    <p class="login-hint">
        Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </p>
</div>

</body>
</html>
